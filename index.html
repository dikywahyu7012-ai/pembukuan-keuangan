<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Pembukuan Keuangan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">

    <!-- Navbar -->
    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold"><i class="fas fa-wallet mr-2"></i> Keuangan Web</h1>
            <div class="flex items-center space-x-4">
                <label for="entitySelect" class="text-sm">Pembukuan:</label>
                <select id="entitySelect" class="text-black rounded px-2 py-1" onchange="changeEntity()">
                    <option value="Pribadi">👤 Pribadi</option>
                    <option value="Kantor A">🏢 Kantor A</option>
                    <option value="Kantor B">🏢 Kantor B</option>
                </select>
                <button onclick="syncData()" class="bg-green-500 hover:bg-green-600 px-3 py-1 rounded text-sm font-semibold transition">
                    <i class="fas fa-sync-alt mr-1"></i> Sync ke Sheet
                </button>
            </div>
        </div>
    </nav>

    <div class="container mx-auto p-4 max-w-6xl mt-4">
        
        <!-- Filter Bulan -->
        <div class="bg-white p-4 rounded shadow mb-6 flex items-center justify-between">
            <h2 class="font-semibold text-gray-700">Filter Data Bulanan</h2>
            <div>
                <input type="month" id="monthFilter" class="border rounded px-3 py-2 text-gray-700" onchange="renderTable()">
            </div>
        </div>

        <!-- Dashboard Ringkasan -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <div class="bg-white p-4 rounded shadow border-l-4 border-blue-500">
                <p class="text-gray-500 text-sm">Total Pemasukan</p>
                <p class="text-2xl font-bold text-blue-600" id="summaryIncome">Rp 0</p>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-red-500">
                <p class="text-gray-500 text-sm">Total Pengeluaran</p>
                <p class="text-2xl font-bold text-red-600" id="summaryExpense">Rp 0</p>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-yellow-500">
                <p class="text-gray-500 text-sm">Arus Kas Bersih</p>
                <p class="text-2xl font-bold text-yellow-600" id="summaryNet">Rp 0</p>
            </div>
            <div class="bg-white p-4 rounded shadow border-l-4 border-green-500">
                <p class="text-gray-500 text-sm">Neraca Saldo Akhir</p>
                <p class="text-2xl font-bold text-green-600" id="summaryBalance">Rp 0</p>
            </div>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="bg-white p-6 rounded shadow mb-6">
            <h2 class="font-semibold text-gray-700 border-b pb-2 mb-4">Tambah Transaksi (Manual / Terencana)</h2>
            <form id="txForm" class="grid grid-cols-1 md:grid-cols-6 gap-4 items-end" onsubmit="addTransaction(event)">
                <div class="col-span-1 md:col-span-1">
                    <label class="block text-sm text-gray-600 mb-1">Tanggal</label>
                    <input type="date" id="txDate" class="border rounded w-full px-3 py-2" required>
                </div>
                <div class="col-span-1 md:col-span-2">
                    <label class="block text-sm text-gray-600 mb-1">Uraian / Keterangan</label>
                    <input type="text" id="txDesc" class="border rounded w-full px-3 py-2" placeholder="Cth: Gaji / Beli ATK" required>
                </div>
                <div class="col-span-1">
                    <label class="block text-sm text-gray-600 mb-1">Tipe</label>
                    <select id="txType" class="border rounded w-full px-3 py-2">
                        <option value="Pemasukan">Pemasukan</option>
                        <option value="Pengeluaran">Pengeluaran</option>
                    </select>
                </div>
                <div class="col-span-1">
                    <label class="block text-sm text-gray-600 mb-1">Nominal (Rp)</label>
                    <input type="number" id="txAmount" class="border rounded w-full px-3 py-2" required min="0">
                </div>
                <div class="col-span-1">
                    <label class="block text-sm text-gray-600 mb-1 flex items-center h-full pt-1 cursor-pointer">
                        <input type="checkbox" id="txPlanned" class="mr-2 transform scale-125">
                        Item Rencana?
                    </label>
                </div>
                <div class="col-span-1 md:col-span-6 flex justify-end">
                    <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded shadow font-semibold">
                        <i class="fas fa-plus mr-1"></i> Simpan Transaksi
                    </button>
                </div>
            </form>
        </div>

        <!-- Tabel Data -->
        <div class="bg-white rounded shadow overflow-hidden">
            <table class="min-w-full text-left border-collapse">
                <thead class="bg-gray-50 text-gray-700 border-b">
                    <tr>
                        <th class="py-3 px-4">Tanggal</th>
                        <th class="py-3 px-4">Uraian</th>
                        <th class="py-3 px-4">Tipe Data</th>
                        <th class="py-3 px-4">Pemasukan</th>
                        <th class="py-3 px-4">Pengeluaran</th>
                        <th class="py-3 px-4">Saldo Berjalan</th>
                        <th class="py-3 px-4 text-center">Aksi</th>
                    </tr>
                </thead>
                <tbody id="tableBody" class="divide-y divide-gray-200">
                    <!-- Data akan dirender menggunakan JavaScript -->
                </tbody>
            </table>
            <div id="emptyState" class="hidden text-center py-8 text-gray-500">
                Belum ada data untuk bulan/entitas ini.
            </div>
        </div>

    </div>

    <script>
        // URL Google Apps Script Anda (Ditanam secara permanen)
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzjnF0kcjkJthvgyPTBaHEwrmCRpKwO166CXKOplY24flfFgvrOE-9Z-gSzSgZXsCBU/exec";
        
        let transactions = JSON.parse(localStorage.getItem('finance_data')) || [];
        
        // Setup awal saat halaman dimuat
        document.addEventListener("DOMContentLoaded", () => {
            let today = new Date();
            // Set default filter bulan ini
            document.getElementById('monthFilter').value = today.toISOString().slice(0,7);
            document.getElementById('txDate').value = today.toISOString().slice(0,10);
            renderTable();
        });

        function formatRp(angka) {
            return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
        }

        function changeEntity() {
            renderTable();
        }

        function addTransaction(e) {
            e.preventDefault();
            const entity = document.getElementById('entitySelect').value;
            const date = document.getElementById('txDate').value;
            const desc = document.getElementById('txDesc').value;
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const isPlanned = document.getElementById('txPlanned').checked;

            transactions.push({
                id: Date.now(),
                entity: entity,
                date: date,
                desc: desc,
                type: type,
                amount: amount,
                isPlanned: isPlanned
            });

            // Simpan ke localstorage dulu sebagai backup
            localStorage.setItem('finance_data', JSON.stringify(transactions));
            
            // Reset form
            document.getElementById('txDesc').value = '';
            document.getElementById('txAmount').value = '';
            document.getElementById('txPlanned').checked = false;

            renderTable();
            
            // Otomatis sinkronisasi setelah menambah data
            syncData();
        }

        function deleteTx(id) {
            if(confirm('Yakin ingin menghapus transaksi ini?')) {
                transactions = transactions.filter(t => t.id !== id);
                localStorage.setItem('finance_data', JSON.stringify(transactions));
                renderTable();
                syncData();
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tableBody');
            const emptyState = document.getElementById('emptyState');
            const activeEntity = document.getElementById('entitySelect').value;
            const monthFilter = document.getElementById('monthFilter').value; // format: YYYY-MM
            
            tbody.innerHTML = '';

            // Filter berdasarkan Entitas
            let filteredTx = transactions.filter(t => t.entity === activeEntity);
            
            // Urutkan berdasarkan tanggal (Kronologis untuk perhitungan saldo)
            filteredTx.sort((a, b) => new Date(a.date) - new Date(b.date));

            // Hitung neraca saldo untuk KESELURUHAN data entitas ini
            let currentBalance = 0;
            filteredTx = filteredTx.map(t => {
                if (t.type === 'Pemasukan') currentBalance += t.amount;
                else currentBalance -= t.amount;
                
                t.balance = currentBalance; // Simpan posisi saldo berjalan
                return t;
            });

            // Filter khusus untuk TAMPILAN BULANAN (setelah saldo dihitung secara global)
            if (monthFilter) {
                filteredTx = filteredTx.filter(t => t.date.startsWith(monthFilter));
            }

            if (filteredTx.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            let totalInc = 0, totalExp = 0;

            filteredTx.forEach(t => {
                if (t.type === 'Pemasukan') totalInc += t.amount;
                else totalExp += t.amount;

                let row = document.createElement('tr');
                row.className = "hover:bg-gray-50 transition";
                
                let isRencanaBadge = t.isPlanned ? `<span class="bg-purple-100 text-purple-700 text-xs px-2 py-1 rounded ml-2">Terencana</span>` : `<span class="bg-gray-100 text-gray-600 text-xs px-2 py-1 rounded ml-2">Manual</span>`;
                
                let incAmount = t.type === 'Pemasukan' ? formatRp(t.amount) : '-';
                let expAmount = t.type === 'Pengeluaran' ? formatRp(t.amount) : '-';

                row.innerHTML = `
                    <td class="py-3 px-4">${t.date}</td>
                    <td class="py-3 px-4 font-medium text-gray-800">${t.desc} ${isRencanaBadge}</td>
                    <td class="py-3 px-4">
                        <span class="${t.type === 'Pemasukan' ? 'text-green-600' : 'text-red-600'} text-sm font-semibold">${t.type}</span>
                    </td>
                    <td class="py-3 px-4 text-green-600">${incAmount}</td>
                    <td class="py-3 px-4 text-red-600">${expAmount}</td>
                    <td class="py-3 px-4 font-bold text-blue-600">${formatRp(t.balance)}</td>
                    <td class="py-3 px-4 text-center">
                        <button onclick="deleteTx(${t.id})" class="text-red-500 hover:text-red-700 transition" title="Hapus">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                `;
                tbody.appendChild(row);
            });

            // Update Ringkasan Dashboard
            document.getElementById('summaryIncome').innerText = formatRp(totalInc);
            document.getElementById('summaryExpense').innerText = formatRp(totalExp);
            document.getElementById('summaryNet').innerText = formatRp(totalInc - totalExp);
            
            // Saldo akhir berdasarkan transaksi terakhir di bulan tersebut
            let finalBalance = filteredTx.length > 0 ? filteredTx[filteredTx.length - 1].balance : 0;
            document.getElementById('summaryBalance').innerText = formatRp(finalBalance);
        }

        async function syncData() {
            const activeEntity = document.getElementById('entitySelect').value;
            const btn = document.querySelector('button[onclick="syncData()"]');
            const originalText = btn.innerHTML;
            
            // Ubah teks tombol jadi loading
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Menyimpan...';
            btn.disabled = true;

            // Ambil semua transaksi khusus entitas yang dipilih dan urutkan berdasarkan tanggal
            let dataToSync = transactions.filter(t => t.entity === activeEntity);
            dataToSync.sort((a, b) => new Date(a.date) - new Date(b.date));

            // Hitung ulang saldo untuk pengiriman ke Google Sheet
            let currentBalance = 0;
            let formattedData = dataToSync.map(t => {
                if (t.type === 'Pemasukan') currentBalance += t.amount;
                else currentBalance -= t.amount;

                return {
                    tanggal: t.date,
                    uraian: t.desc,
                    tipe: t.type,
                    nominal: t.amount,
                    neracaSaldo: currentBalance,
                    isPlanned: t.isPlanned
                };
            });

            try {
                // Proses mengirim ke Google Sheets
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({
                        sheet: activeEntity,
                        data: formattedData
                    })
                });

                // Tampilkan notifikasi berhasil sebentar
                btn.innerHTML = '<i class="fas fa-check mr-1"></i> Tersimpan!';
                btn.classList.replace('bg-green-500', 'bg-blue-500');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-blue-500', 'bg-green-500');
                    btn.disabled = false;
                }, 2000);

            } catch (error) {
                console.error("Gagal menyimpan ke Google Sheets", error);
                alert("Gagal sinkronisasi ke Google Sheets. Pastikan koneksi internet lancar dan Apps Script diatur menjadi 'Anyone'.");
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
